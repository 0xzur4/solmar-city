<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solmar — An Open-World Crime Story</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
      }
      body {
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        image-rendering: auto;
      }
      /* Announced to screen readers, kept off the canvas so it never overlaps the game's own text. */
      #status {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Solmar game view"></canvas>
    <div id="status" aria-live="polite">Solmar. Press Enter or click to start.</div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
